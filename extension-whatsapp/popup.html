<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 320px; padding: 14px; background: #0f172a; color: #e2e8f0; }
h1 { font-size: 15px; margin: 0 0 10px; color: #22c55e; }
label { display: block; font-size: 11px; text-transform: uppercase; margin: 10px 0 4px; color: #94a3b8; letter-spacing: .05em; }
input { width: 100%; padding: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; border-radius: 6px; box-sizing: border-box; font-size: 12px; }
button { width: 100%; padding: 9px; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 8px; font-size: 13px; }
.btn-start { background: #22c55e; color: #052e16; }
.btn-stop { background: #ef4444; color: white; }
.btn-save { background: #3b82f6; color: white; }
.status { margin-top: 12px; padding: 10px; background: #1e293b; border-radius: 6px; font-size: 12px; line-height: 1.5; }
.row { display: flex; justify-content: space-between; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.dot-on { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
.dot-off { background: #64748b; }
.hint { font-size: 11px; color: #94a3b8; margin-top: 8px; }
</style>
</head>
<body>
<h1>Zap Sender · Central MEI</h1>

<label>Token da extensão</label>
<input id="token" type="password" placeholder="Cole o token do painel" />

<label>URL do painel (opcional)</label>
<input id="base" type="text" placeholder="https://seu-certificado-mei-digital.online" />

<button id="save" class="btn-save">Salvar configurações</button>

<div class="status" id="status">
  <div class="row"><span><span class="dot dot-off" id="dot"></span><span id="statuslabel">Parado</span></span><span id="tabinfo"></span></div>
  <div class="row"><span>Enviadas hoje:</span><b id="senttoday">0</b></div>
  <div class="row"><span>Nesta sessão:</span><b id="sessionsent">0</b></div>
  <div class="row"><span>Falhas:</span><b id="failed">0</b></div>
  <div class="row"><span>Limite diário:</span><b id="daily">-</b></div>
</div>

<button id="start" class="btn-start">Iniciar envio automático</button>
<button id="stop" class="btn-stop" style="display:none">Pausar</button>

<div class="hint">Mantenha o WhatsApp Web aberto e logado nesta janela.</div>

<script src="popup.js"></script>
</body>
</html>
